<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sayang! ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffe6e6 0%, #ffb6c1 100%);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 30px 20px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
            position: relative;
            backdrop-filter: blur(5px);
        }

        .header-title {
            font-family: 'Sacramento', cursive;
            font-size: 2.8rem;
            color: #ff4757;
            margin-bottom: 5px;
        }

        .sub-title {
            font-size: 0.9rem;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Photo Gallery */
        .gallery {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .photo-card {
            width: 110px;
            height: 110px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border: 3px solid #fff;
            transition: transform 0.3s ease;
            position: relative;
        }

        .photo-card:hover {
            transform: scale(1.08) rotate(2deg);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Message Box */
        .message-box {
            background: #fff0f3;
            border-radius: 16px;
            padding: 20px;
            font-size: 0.95rem;
            line-height: 1.7;
            color: #555;
            margin-bottom: 25px;
            text-align: left;
            border-left: 4px solid #ff6b81;
        }

        /* Interactive Button */
        .btn-love {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }

        .btn-love:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 71, 87, 0.6);
        }

        /* Floating Hearts Animation */
        .floating-heart {
            position: fixed;
            font-size: 1.5rem;
            user-select: none;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 999;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.8) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.4) rotate(360deg);
                opacity: 0;
           }
        }

        #ytPlayer {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Lagu Ulang Tahun Awal (Memakai MP3 lokal di GitHub) -->
    <audio id="laguHBD" src="Happy Birthday.mp3" autoplay loop></aud

    <div class="card">
        <h1 class="header-title">Happy Birthday! ❤️</h1>
        <p class="sub-title">30 Januari • Untuk Pacarku</p>

        <!-- Gallery Foto (Ganti URL/file foto di bawah) -->
        <div class="gallery">
            <div class="photo-card">
                <img src="foto1.jpeg" alt="Foto 1">
            </div>
            <div class="photo-card">
                <img src="foto5.jpeg" alt="Foto 2">
            </div>
            <div class="photo-card">
                <img src="foto6.jpeg" alt="Foto 3">
            </div>
        </div>

        <!-- Surat Ucapan -->
        <div class="message-box">
            <p>Allowww my handsome, my love, my world!🕊️✨🤍 <br><br>
            Happy Birthday to u cintaku! selamat bertambah usia sayang, diumur kamu sekarang ini aku berdoa semoga kamu selalu lindungan Allah SWT. Walaupun kita LDR dan belum bisa rayain langsung bareng-bareng, semoga kehangatan ucapan ini sampai ke kamu.<br><br>
            Selalu sehat, selalu baikk, dan menjadi seseorang yang selaluuu ingin tumbuh menjadi lebih baik, jadi pribadi yang lebih baik buat diri sendiri dan orang lain yaaa!<br><br>
            Terima kasih ya sudah selalu sabar, menemani hari-hariku, dan bertahan sejauh ini. Semoga di umur yang baru ini kamu sehat selalu, makin sukses, dan semua impianmu bisa tercapai satu per satu.<br><br>
            Ingat ada aku disini yang selalu nemenin proses kamu, kamu jangan takut akan kehilangan aku:V, malah aku yang lebih takut kamu pergi dari aku.<br><br>
            Aku harap kamu adalah tidak berubah ya sayang, tetap sayang sama aku wkkwkwk dan itu harusssss AKU MAKSAA!<br><br>
            AHAHAHHA kita jalanin hubungan udah 5 bulan, bismillah sampai ke pelaminan yaw awww><.<br><br>
            Terima kasih sudah mencintai perempuan serumit aku, yang banyak kurangnya hihi.. Love Youu<br><br>
            INGAT JANGAN INSECURE SAMA AKU, AKU TETAP MENGHARGAI APAPUN ITU YANG KAMU KASIH KE AKU, SELAGI KAMU BERUSAHA BUAT AKU, AKU BERSYUKUR SANGAT SANGAT BERSYUKURRR:).<br><br>
            seiring waktu berjalan, semoga rasa sayangmu tidak akan pernah berubah sedikitpun><.<br><br>
            Sampai ketemu di pertemuan kita selanjutnya! Aku sayang kamu. ❤️</p>
        </div>

        <!-- Tombol Kejutan Animasi -->
        <button class="btn-love" onclick="kirimCinta()">Tekan Untuk Love! ✨</button>
    </div>

    <script>
        function kirimCinta() {
            // Membuat hujan animasi hati saat tombol diklik
            for (let i = 0; i < 35; i++) {
                setTimeout(() => {
                    createHeart();
                }, i * 100);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            
            // Variasi ikon cinta
            const icons = ['❤️', '💖', '💕', '💗', '🌸'];
            heart.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }
    </script>
</body>
</html>
